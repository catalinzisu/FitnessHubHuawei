name: Build debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Provides Gradle 8.14.3 until the wrapper (gradlew) is committed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Week 5: add the google-services.json step from the plan (section 3B) here.

      - name: Build
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
