name: Build debug APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle; the version comes from the committed wrapper (gradlew).
      - uses: gradle/actions/setup-gradle@v4

      # Week 5: add the google-services.json step from the plan (section 3B) here.

      - name: Build
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest :server:test assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
